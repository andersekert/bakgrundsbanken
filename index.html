/* Layout: karta eller rutnät av bakgrunder under en sök- och filterrad; detaljvy med solkompass och väder. */
:root{

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101315; --surface:#191d21; --sunk:#14181b; --ink:#e7eaec; --muted:#9aa3ab; --line:#2b3237;
  --accent:#f0a33a; --accent-ink:#1d1200; --accent-soft:#3a2a12; --dir:#73acec;

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1}
h2{font-size:24px;line-height:1.1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}

button:hover,.btn:hover{border-color:var(--muted)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,label.drop:focus-within{outline:2px solid var(--dir);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover{border-color:var(--accent);filter:brightness(1.05)}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.danger{color:var(--danger)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],textarea{font:16px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.mono{font-family:var(--mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.searchrow input{flex:1 1 220px}
.filters{display:grid;gap:10px}
.frow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.frow .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font:500 13px/1 var(--body);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:var(--bg)}
.chip.role{border-style:dashed}
.chip.static{cursor:default}
.chip .x{border:0;background:none;padding:0 0 0 2px;color:inherit;font-size:15px;line-height:1;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;white-space:normal}

.card .ph{aspect-ratio:4/3;background:var(--sunk);position:relative;width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}

.card .t{font:600 18px/1.15 var(--display)}
.card .m{font-size:12px;color:var(--muted);font-family:var(--mono)}

.card .mini span{font-size:11.5px;padding:3px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.card .mini span.r{background:var(--accent-soft);color:var(--ink)}
#map{height:min(70vh,640px);border-radius:12px;border:1px solid var(--line);z-index:0}
.leaflet-popup-content{font:13px/1.4 var(--body);margin:10px}
.pop{display:flex;flex-direction:column;gap:6px;width:200px}
.pop img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#ddd}
.pop b{font:600 16px/1.15 var(--display)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:640px}
.empty p{margin:0;color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;font-size:13.5px}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink)}
.notice.info{background:var(--info-bg);color:var(--info-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.auth{max-width:420px}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}

.field>label,.field>.lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.exif dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.chipin{display:flex;flex-direction:column;gap:6px}

.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:20px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stage img{width:100%;display:block;min-height:120px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.timebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.timebar input[type=date]{width:auto}
.timebar .clock{font:600 20px/1 var(--mono);min-width:58px}
.badge{display:inline-block;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.wx .now{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.wx .now .temp{font:600 30px/1 var(--display)}
.wx .now .cond{font-weight:600}

.meta dt{color:var(--muted);font-size:13px}
.meta dd{margin:0;overflow-wrap:anywhere}
.near{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.near button{padding:0;border-radius:8px;overflow:hidden;flex:0 0 120px;aspect-ratio:4/3}
.near img{width:100%;height:100%;object-fit:cover;display:block}
.note-text{white-space:pre-wrap;margin:0}
.small{font-size:12.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13px}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mlist .mrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.mlist .mrow:first-child{border-top:0}
.mlist .mrow .e{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
</style>

  <section id="formView" hidden></section>

  <section id="detailView" hidden></section>
</div>

function renderAuth(msg){
  showOnly("authView"); $("topActions").hidden = true;
  var v = $("authView"); v.innerHTML = "";
  var signup = false;
  var emailIn = el("input", {type:"email", id:"aEmail", autocomplete:"email", placeholder:"namn@tv4.se"});
  var passIn = el("input", {type:"password", id:"aPass", autocomplete:"current-password", placeholder:"Lösenord"});
  var err = el("div", {class:"err", role:"alert", text:msg || ""});
  var title = el("h2", {text:"Logga in"});
  var go = el("button", {type:"submit", class:"primary", text:"Logga in"});
  var toggle = el("button", {type:"button", class:"ghost", text:"Skapa konto i stället"});
  var hint = el("p", {class:"small", style:"margin:0", text:"Bara inbjudna e-postadresser kommer åt bilderna."});
  toggle.addEventListener("click", function(){ signup = !signup; title.textContent = signup ? "Skapa konto" : "Logga in"; go.textContent = signup ? "Skapa konto" : "Logga in"; toggle.textContent = signup ? "Jag har redan ett konto" : "Skapa konto i stället"; passIn.setAttribute("autocomplete", signup ? "new-password" : "current-password"); passIn.placeholder = signup ? "Välj lösenord, minst 8 tecken" : "Lösenord"; });
  var f = el("form", {class:"panel auth"}, [title, hint, el("div", {class:"field"}, [el("label", {for:"aEmail", text:"E-post"}), emailIn]), el("div", {class:"field"}, [el("label", {for:"aPass", text:"Lösenord"}), passIn]), err, el("div", {class:"actions"}, [go, toggle])]);
  f.addEventListener("submit", async function(ev){
    ev.preventDefault(); err.textContent = "";
    var e = emailIn.value.trim(), pw = passIn.value;
    if(!e || !pw){ err.textContent = "Fyll i e-post och lösenord."; return; }
    if(signup && pw.length < 8){ err.textContent = "Lösenordet måste vara minst 8 tecken."; return; }
    go.disabled = true;
    var r = signup ? await sb.auth.signUp({email:e, password:pw}) : await sb.auth.signInWithPassword({email:e, password:pw});
    go.disabled = false;
    if(r.error){ err.textContent = /invalid login/i.test(r.error.message) ? "Fel e-post eller lösenord." : /already registered/i.test(r.error.message) ? "Kontot finns redan. Logga in i stället." : r.error.message; return; }
    if(signup && !r.data.session){ err.textContent = "Kontot är skapat men kräver bekräftelse via e-post. Be Anders stänga av e-postbekräftelse i Supabase."; }
  });
  v.appendChild(f);
}
async function afterLogin(){
  myEmail = (session.user && session.user.email) || ""; myId = session.user && session.user.id;
  var r = await sb.from("members").select("email,is_admin").eq("email", myEmail.toLowerCase()).maybeSingle();
  if(r.error || !r.data){
    showOnly("authView"); $("topActions").hidden = true; var v = $("authView"); v.innerHTML = "";
    v.appendChild(el("div", {class:"panel auth"}, [el("h2", {text:"Inte inbjuden än"}), el("p", {style:"margin:0", text:"Kontot " + myEmail + " finns inte på medlemslistan. Be den som administrerar Bakgrundsbanken lägga till adressen, och ladda sedan om sidan."}), el("div", {class:"actions"}, [el("button", {type:"button", text:"Ladda om", onclick:function(){ location.reload(); }}), el("button", {type:"button", class:"ghost", text:"Logga ut", onclick:function(){ sb.auth.signOut(); }})])]));
    return;
  }
  isAdmin = !!r.data.is_admin; $("membersBtn").hidden = !isAdmin; $("topActions").hidden = false;
  $("countLine").textContent = "Laddar bakgrunder…"; showOnly("listView");
  await loadPhotos();
}

/* ===== routing ===== */
function route(){
  if(form || !session) return;
  var m = /^#bild-([A-Za-z0-9-]+)$/.exec(location.hash);
  if(m){ showOnly("detailView"); renderDetail(m[1]); window.scrollTo(0,0); }
  else { showOnly("listView"); detailState = null; renderList(); }
}
window.addEventListener("hashchange", function(){ if(!$("membersView").hidden) return; route(); });
$("q").addEventListener("input", function(){ filt.q = this.value.trim().toLowerCase(); fitted = false; renderList(); });
$("clearBtn").addEventListener("click", clearFilters);
$("addBtn").addEventListener("click", function(){ openForm("new"); });
$("membersBtn").addEventListener("click", openMembers);
$("logoutBtn").addEventListener("click", function(){ sb.auth.signOut(); });
$("modeMap").addEventListener("click", function(){ mode = "map"; try{ localStorage.setItem("bb_mode", mode); }catch(_e){} renderList(); });
$("modeGrid").addEventListener("click", function(){ mode = "grid"; try{ localStorage.setItem("bb_mode", mode); }catch(_e){} renderList(); });

/* ===== start ===== */
if(SUPABASE_URL.indexOf("__") === 0 || !window.supabase){ $("gate").hidden = false; $("gate").textContent = window.supabase ? "Appen är inte kopplad till någon databas än." : "Kunde inte ladda inloggningen. Kontrollera uppkopplingen och ladda om."; return; }
sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
sb.auth.onAuthStateChange(function(evt, s){
  var had = !!session; session = s;
  if(!s){ photos = []; renderAuth(); return; }
  if(evt === "SIGNED_IN" && had) return;
  if(evt === "TOKEN_REFRESHED" || evt === "USER_UPDATED") return;
  afterLogin();
});
})();
</script>
